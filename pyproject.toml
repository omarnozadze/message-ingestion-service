[project]
name = "message-ingestion-service"
version = "0.43.0"
description = "Production-style message ingestion and client matching service for 1C integration"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]==0.142.2",
  "sqlalchemy[asyncio]==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "rapidfuzz==3.14.6",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
